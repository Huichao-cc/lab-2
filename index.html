<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Care</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Cat Care</h1>
        <p>Take care of your cat!</p>
    </header>
    <main>
        <section class="cat">
            <h2>Meet Your Cat</h2>
            <div id="cat-image" role="img" aria-label="A happy cat">😺</div>
            <p id="cat-status" role="status">Your cat is waiting for you.</p>
        </section>
        <section class="actions">
            <h2>What would you like to do?</h2>
            <div class="buttons">
                <button id="feed-button" type="button">Feed</button>
                <button id="play-button" type="button">Play</button>
                <button id="rest-button" type="button">Rest</button>
            </div>
            <p>Click a button to take care of your cat.</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
